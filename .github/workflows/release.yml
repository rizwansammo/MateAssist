# Build the three production images, then deploy them.
#
# Runs on every push to main. Version tags still work and still produce a
# tagged image - they now MARK a release rather than cause one.
#
# This used to build only on a tag and stop there, with the deploy done by hand
# over SSH. The stated reason was that a tag is a deliberate "this is ready"
# moment. In practice every push was followed by someone manually creating a
# tag and then manually running the same four commands on the server, so the
# moment bought nothing and the pipeline was simply unfinished.
#
# The tradeoff that IS real: a bad migration now reaches production before
# anyone looks at it. Migrations are exercised in CI, there is one backend
# container, and the deploy job verifies the site after restarting - so the
# failure is loud rather than silent. Undo is a reverse migration, not a
# withheld deploy.

name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the commit SHA)"
        required: false

env:
  REGISTRY: ghcr.io
  OWNER: rizwansammo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Fail-fast off: if the admin image fails to build, still publish the
      # other two rather than leaving a half-known state.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            app: ""
          - name: portal
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            app: portal
          - name: admin
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            app: admin

    steps:
      - uses: actions/checkout@v4

      # The backend image installs torch and the transformers stack. A
      # GitHub-hosted runner starts with roughly 14GB free, and between the
      # preinstalled Android SDK, .NET and CodeQL images there is enough
      # baggage to run it out of space mid-build - which kills the job with no
      # log rather than an error. Reclaiming what we will never use costs about
      # 30 seconds and removes an entire class of unexplainable failure.
      - name: Reclaim runner disk
        if: matrix.name == 'backend'
        run: |
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${OWNER}/mateassist-${{ matrix.name }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.tag }}"
            # Short SHA, and the deploy job derives the same value the same
            # way. They were the full 40 characters here and 7 there, so a
            # push-built image existed under a tag the deploy would never ask
            # for - a pull failure at the last step of an otherwise good run.
            [ -n "$VERSION" ] || VERSION="${GITHUB_SHA::7}"
          fi
          # Both a moving `latest` and an immutable version tag. The compose file
          # defaults to latest for convenience; pin the version tag in .env when
          # you need to know exactly what is running, or to roll back.
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP=${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # `min` for the backend: `max` also exports every intermediate layer,
          # and the builder stage here contains the whole torch install. Caching
          # it costs more disk on the runner than it saves in build time.
          cache-to: type=gha,mode=${{ matrix.name == 'backend' && 'min' || 'max' }},scope=${{ matrix.name }}

      - name: Summary
        run: echo "Published ${{ steps.tags.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  #
  # Only after all three images exist. `needs: build` with fail-fast off on the
  # matrix means a partial build still fails this job: deploying two of three
  # images gives a portal talking to a backend from a different commit.
  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    # A build triggered by anything other than a push to main or a version tag
    # is someone testing the pipeline, and must not reach the server.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      # Both workflows are triggered by the same push and run side by side, so
      # without this the deploy lands about three minutes before CI reports.
      # A failing test suite would then be discovered on a commit that is
      # already serving users, which is the opposite of what the suite is for.
      #
      # Only the DEPLOY waits. The image builds run in parallel with CI, so
      # gating here costs the difference between the two, not their sum.
      # Both workflows are triggered by the same push and run side by side, so
      # without this the deploy lands about three minutes before CI reports.
      # A failing test suite would then be discovered on a commit that is
      # already serving users, which is the opposite of what the suite is for.
      #
      # Only the DEPLOY waits. The image builds run in parallel with CI, so
      # gating here costs the difference between the two, not their sum.
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            # --repo because this job never checks the code out - it only SSHes -
            # so gh has no git directory to infer the repository from and fails
            # with "not a git repository".
            #
            # gh's own --jq rather than piping to jq: one fewer thing that has to
            # be installed on the runner for a safety gate to work. `.[0] // {}`
            # covers the first seconds when CI has not registered a run yet.
            state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml                       --commit "$GITHUB_SHA" --limit 1                       --json status,conclusion                       --jq '.[0] // {} | "\(.status // "missing") \(.conclusion // "none")"')
            status=${state%% *}
            conclusion=${state##* }
            echo "attempt $attempt: status=$status conclusion=$conclusion"

            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] && exit 0
              echo "::error::CI concluded '$conclusion' for $GITHUB_SHA - refusing to deploy."
              exit 1
            fi
            sleep 15
          done
          # Never deploy on a timeout. An unknown CI result is not a pass, and
          # guessing here would reintroduce exactly the hole this closes.
          echo "::error::CI did not finish within 15 minutes - refusing to deploy."
          exit 1

      - name: Work out which tag to deploy
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned host key, not StrictHostKeyChecking=no. Accepting whatever
          # key answers would hand this deploy - and the private key it carries
          # - to anything that could win a race for that address.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          TAG: ${{ steps.version.outputs.tag }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy "${USER}@${HOST}" bash -s <<EOF
          set -euo pipefail
          cd /opt/MateAssist

          # Rewrite only MateAssist's own image tags. Three other people-facing
          # apps share this box and must not be touched by this deploy.
          sed -i -E "s|(ghcr.io/rizwansammo/mateassist-[a-z]+):[^[:space:]]+|\1:${TAG}|g" .env
          grep '_IMAGE=' .env

          docker compose pull backend portal admin

          # --no-build: the compose file carries build sections for local use,
          # and a missing image must fail loudly rather than have the server try
          # to build from source it does not have.
          docker compose up -d --no-build backend portal admin celery_worker celery_beat

          # --database=admin: the default connection is the deliberately
          # under-privileged RLS role and cannot alter tables. A bare migrate
          # fails with "must be owner of table".
          docker compose exec -T backend python manage.py migrate --database=admin
          EOF

      - name: Verify the site is actually up
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # From the server, so this tests the app rather than the internet.
          # Containers need a moment after restart; a single immediate curl
          # would report a healthy deploy as broken.
          ssh -i ~/.ssh/deploy "${USER}@${HOST}" bash -s <<'EOF'
          set -euo pipefail
          for attempt in $(seq 1 20); do
            ok=1
            for url in https://mateassist.site/                        https://mateassist.site/platform_admin/                        https://netamate.mateassist.site/                        https://netamate.mateassist.site/api/v1/health/; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
              echo "  $code  $url"
              [ "$code" = "200" ] || ok=0
            done
            [ "$ok" = "1" ] && { echo "All endpoints healthy."; exit 0; }
            echo "attempt $attempt: not ready yet"
            sleep 6
          done
          echo "Deploy finished but the site is not answering 200."
          docker compose -f /opt/MateAssist/docker-compose.yml logs --tail=40 backend
          exit 1
          EOF

      - name: Summary
        run: |
          echo "Deployed ${{ steps.version.outputs.tag }} to production" >> "$GITHUB_STEP_SUMMARY"
