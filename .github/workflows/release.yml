# Build and publish the three production images to GHCR.
#
# Triggered by a version tag, or manually. Deliberately NOT on every push to
# main: an image per commit fills the registry with builds nobody deployed, and
# makes "which image is live?" a question with a fuzzy answer.
#
# Deployment is a separate, manual step on the VPS. That is a choice, not an
# omission - see docs/DEPLOY.md. A push-to-deploy pipeline on a box that also
# runs three other people-facing apps means one bad merge takes them all down
# with it.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the commit SHA)"
        required: false

env:
  REGISTRY: ghcr.io
  OWNER: rizwansammo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Fail-fast off: if the admin image fails to build, still publish the
      # other two rather than leaving a half-known state.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            app: ""
          - name: portal
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            app: portal
          - name: admin
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            app: admin

    steps:
      - uses: actions/checkout@v4

      # The backend image installs torch and the transformers stack. A
      # GitHub-hosted runner starts with roughly 14GB free, and between the
      # preinstalled Android SDK, .NET and CodeQL images there is enough
      # baggage to run it out of space mid-build - which kills the job with no
      # log rather than an error. Reclaiming what we will never use costs about
      # 30 seconds and removes an entire class of unexplainable failure.
      - name: Reclaim runner disk
        if: matrix.name == 'backend'
        run: |
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          IMAGE="${REGISTRY}/${OWNER}/mateassist-${{ matrix.name }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.tag }}"
            [ -n "$VERSION" ] || VERSION="${GITHUB_SHA}"
          fi
          # Both a moving `latest` and an immutable version tag. The compose file
          # defaults to latest for convenience; pin the version tag in .env when
          # you need to know exactly what is running, or to roll back.
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP=${{ matrix.app }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # `min` for the backend: `max` also exports every intermediate layer,
          # and the builder stage here contains the whole torch install. Caching
          # it costs more disk on the runner than it saves in build time.
          cache-to: type=gha,mode=${{ matrix.name == 'backend' && 'min' || 'max' }},scope=${{ matrix.name }}

      - name: Summary
        run: echo "Published ${{ steps.tags.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
