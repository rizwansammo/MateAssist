[project]
name = "mateassist-backend"
version = "0.1.0"
description = "MateAssist - multi-tenant agentic IT helpdesk SaaS backend"
requires-python = ">=3.12,<3.13"           # D-001 / A-003

dependencies = [
    "Django>=5.2,<5.3",                     # D-002: LTS, supported to ~2028
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",                 # D-005
    "celery[redis]>=5.4",                   # D-004
    "django-celery-beat>=2.7",
    "drf-spectacular>=0.27",
    "djangorestframework-simplejwt>=5.3",   # D-030
    "django-cors-headers>=4.4",
    "pgvector>=0.3",
    "uvicorn[standard]>=0.30",              # D-003: ASGI, required for SSE
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S", "C4", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "DJ001", # null=True on CharField is deliberate in some tenancy columns
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"*/settings/*" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"
testpaths = ["apps", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
