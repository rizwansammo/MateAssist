# Serving config for a built single-page app.
#
# This nginx sits INSIDE the container and only serves files. TLS, the API proxy
# and tenant routing all happen at the host's edge nginx - keeping them there
# means one place to reason about certificates and one place that knows about
# hostnames.

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Hashed assets are immutable by construction: a change produces a new
    # filename, so a year-long cache can never serve stale code.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must NOT be cached. It is the file that references the hashed
    # bundles, so a cached copy pins a browser to a deployment that no longer
    # exists - the classic "users see the old app until they hard-refresh".
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: any unknown path is a route, not a missing file.
    # Without this, refreshing on /app/chat/42 returns 404 from nginx before
    # React ever loads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The container is reached only through the host's nginx, which sets the
    # real security headers. Repeating them here would send some twice.
    server_tokens off;
}
